# The caches of `renyi run`, the image cache (decision AU10) and the cache
# keyed by the sources (decision AU43), are off for every process cargo
# starts, the tests among them: a test that runs a program twice must run
# it the same way twice, and the conformance runner's runs with every
# code object compiled must test the front end and the JIT, not what a
# previous run left. The caches' own tests turn them on with a directory
# of their own.
[env]
RENYI_NO_CACHE = "1"

# The web crate (decision AW29): the parser, the checker and the render
# recurse on the Rust stack, which the command line gives 64 MiB; the
# module's stack is set when it is linked, 16 MiB in place of the
# default 1 MiB.
[target.wasm32-unknown-unknown]
rustflags = ["-C", "link-arg=-zstack-size=16777216"]
