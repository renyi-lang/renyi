[package]
name = "renyi"
description = "The Renyi toolchain: one binary for checking, formatting, running, testing and indexing Renyi programs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# decision AK1: the crate is a library too, so that a binary built with
# extensions is a crate of three lines on top of it
[lib]
name = "renyi"
path = "src/lib.rs"

[[bin]]
name = "renyi"
path = "src/main.rs"
doc = false

[dependencies]
renyi_syntax.workspace = true
renyi_check.workspace = true
renyi_index.workspace = true
renyi_workspace.workspace = true
renyi_vm.workspace = true
renyi_package.workspace = true
renyi_json.workspace = true
ureq = "3"
mimalloc = "0.1.52"
