[package]
name = "renyi"
description = "The Renyi toolchain: one binary for checking, formatting, running and building Renyi programs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "renyi"
path = "src/main.rs"

[dependencies]
renyi_syntax = { path = "../renyi_syntax" }
renyi_check = { path = "../renyi_check" }
renyi_index = { path = "../renyi_index" }
renyi_vm = { path = "../renyi_vm" }
