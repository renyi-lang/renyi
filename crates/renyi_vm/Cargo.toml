[package]
name = "renyi_vm"
description = "The Renyi virtual machine: bytecode, values, the library primitives and the runner (milestone M3)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
renyi_json.workspace = true
renyi_syntax.workspace = true
renyi_check.workspace = true
num-bigint = "0.4"
num-traits = "0.2"
num-integer = "0.1"
indexmap = "2"
regex = "1"
sha2 = "0.10"
# decision S1: the HTTP client, and SQLite compiled into the binary
ureq = "3"
rusqlite = { version = "0.40", features = ["bundled"] }
# decision AF1: shared libraries loaded at run time for the foreign function interface
libloading = "0.8"
# decision AT5: the code section of an image mapped executable from its file
memmap2 = "0.9"
# decision AG1: machine code for the bytecode, generated inside the process
cranelift-codegen = "0.134"
cranelift-frontend = "0.134"
cranelift-native = "0.134"
# decision AS1: the generated code is placed in executable memory by the VM
# itself (what cranelift-jit did), so that an image of it can be loaded
region = "3.0"
wasmtime-internal-jit-icache-coherence = "47.0.4"
