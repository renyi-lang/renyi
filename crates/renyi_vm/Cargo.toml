[package]
name = "renyi_vm"
description = "The Renyi virtual machine: bytecode, values, the library primitives and the runner (milestone M3)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
renyi_json = { path = "../renyi_json" }
renyi_syntax = { path = "../renyi_syntax" }
renyi_check = { path = "../renyi_check" }
num-bigint = "0.4"
num-traits = "0.2"
num-integer = "0.1"
indexmap = "2"
regex = "1"
sha2 = "0.10"
# decision S1: the HTTP client, and SQLite compiled into the binary
ureq = "3"
rusqlite = { version = "0.40", features = ["bundled"] }
