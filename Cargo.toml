[workspace]
resolver = "2"
members = [
    "crates/renyi_json",
    "crates/renyi_syntax",
    "crates/renyi_package",
    "crates/renyi_check",
    "crates/renyi_index",
    "crates/renyi_workspace",
    "crates/renyi_vm",
    "crates/renyi",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
# decision AI4: the repository moves to the organisation before release 0.1
repository = "https://github.com/renyi-lang/renyi"

# crates.io takes a version on every dependency, path or not (decision AI2);
# the crates name each other through this table, so that a release bumps
# `version` above and the versions here together (`docs/RELEASE.md`)
[workspace.dependencies]
renyi_json = { path = "crates/renyi_json", version = "0.1.0" }
renyi_syntax = { path = "crates/renyi_syntax", version = "0.1.0" }
renyi_package = { path = "crates/renyi_package", version = "0.1.0" }
renyi_check = { path = "crates/renyi_check", version = "0.1.0" }
renyi_index = { path = "crates/renyi_index", version = "0.1.0" }
renyi_workspace = { path = "crates/renyi_workspace", version = "0.1.0" }
renyi_vm = { path = "crates/renyi_vm", version = "0.1.0" }

# Decision X1: the VM and every dependency are optimized in development
# builds, so that `cargo test`, CI and every `renyi run` from a development
# build get the release speed of the interpreter; the front end, the checker
# and the binary keep their fast rebuilds.
[profile.dev.package.renyi_vm]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3

# Decision AG1: the release binary is optimized as one unit (link-time
# optimization, one codegen unit), which bought a sixth on the interpreter's
# loops; the development profile is untouched, so `cargo test` builds as
# before.
[profile.release]
lto = "fat"
codegen-units = 1
