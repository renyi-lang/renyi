[workspace]
resolver = "2"
members = [
    "crates/renyi_json",
    "crates/renyi_syntax",
    "crates/renyi_package",
    "crates/renyi_check",
    "crates/renyi_index",
    "crates/renyi_vm",
    "crates/renyi",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
# decision AI4: the repository moves to the organisation before release 0.1
repository = "https://github.com/renyi-lang/renyi"

# Decision X1: the VM and every dependency are optimized in development
# builds, so that `cargo test`, CI and every `renyi run` from a development
# build get the release speed of the interpreter; the front end, the checker
# and the binary keep their fast rebuilds.
[profile.dev.package.renyi_vm]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3

# Decision AG1: the release binary is optimized as one unit (link-time
# optimization, one codegen unit), which bought a sixth on the interpreter's
# loops; the development profile is untouched, so `cargo test` builds as
# before.
[profile.release]
lto = "fat"
codegen-units = 1
