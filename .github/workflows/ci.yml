# Continuous integration (decision V8): on every push and pull request, the
# checks a commit must pass before it touches `crates/` or the corpus, as
# `CLAUDE.md` lists them, plus the conformance suite run against the built
# binary by the implementation-independent runner.

name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # the image cache of `renyi run` stays off in CI (decision AU10), as
  # `.cargo/config.toml` keeps it off under cargo
  RENYI_NO_CACHE: "1"

jobs:
  checks:
    name: Format, lint, test, corpus and conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # the toolchain of the owner's machine, so that CI and the local
      # gates agree on clippy's lints
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # the VM without its features (decision AW29): what the web crate
      # builds, checked on the native target too
      - name: The VM without its features
        run: cargo check -p renyi_vm --no-default-features

      # a Python 3 on the PATH: the bridge's tests (decision AL1) and the
      # conformance cases of `tests/conformance/python/` run one
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test
        run: cargo test

      - name: Canonical corpus
        run: cargo run -q -- format --check examples/*.ry

      # the front end written in Renyi (decision W2) checks clean, its
      # development aids included; `cargo test` above holds its layout
      # canonical and its tree equal to `renyi parse --json`
      - name: Self-hosted front end
        run: cargo run -q -- check compiler/*.ry

      # the benchmark programs (decision AG4) are held to the same
      # standard as the front end
      - name: Benchmark programs
        run: cargo run -q -- check bench/*.ry bench/micro/*.ry bench/selfcheck/*.ry && cargo run -q -- format --check bench/*.ry bench/micro/*.ry bench/selfcheck/*.ry

      # the starter pack for agents (decision AI3): the five workflows
      # check clean, are in canonical layout and pass their tests from
      # their recordings; the skill's cheat sheet is the repository's; the
      # retrieval example (decision AW43) compiles (a model is not run here)
      - name: Starter pack
        run: |
          cargo run -q -- check starter/workflows/*.ry
          cargo run -q -- format --check starter/workflows/*.ry
          cargo run -q -- test starter/workflows/*.ry
          cmp docs/cheatsheet.md starter/skill/renyi/cheatsheet.md
          python -m py_compile starter/retrieval/retrieve.py

      # the showcase game (decision AW28, stage 34) is held like the
      # starter pack: it checks clean under `--strict`, is in canonical
      # layout and passes the examples and tests of every module
      - name: Showcase game
        run: |
          cargo run -q -- check --strict showcase/raycaster/*.ry
          cargo run -q -- format --check showcase/raycaster/*.ry
          cargo run -q -- test showcase/raycaster/raycaster.ry

      # the C API (decision AW46, stages 40a and 40b): the library builds,
      # the C example compiles against it with the system's compiler, runs
      # on its module and prints what examples/host.expected holds, and
      # the Python example does the same through the binding over ctypes,
      # which finds the library under target/debug by itself
      - name: The C API and the Python binding
        run: |
          cargo build -q -p renyi_c
          cc crates/renyi_c/examples/host.c -Icrates/renyi_c/include -Ltarget/debug -lrenyi_c -Wl,-rpath,"$PWD/target/debug" -o target/host_example
          target/host_example crates/renyi_c/examples/calc.ry | diff - crates/renyi_c/examples/host.expected
          python bindings/python/example.py crates/renyi_c/examples/calc.ry | diff - bindings/python/example.expected

      # the client of the language server (decision AN2) bundles, so
      # that a release does not find out
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: VS Code client
        working-directory: editors/vscode
        run: npm ci && npm run build

      - name: Corpus lint
        run: python tools/lint_examples.py

      # the authority gap (decision AX2): the measure's output on the
      # pinned data must be the pinned output
      - name: Authority gap
        run: python -I tools/authority_gap/authority_gap.py tests/authority/tasks_v1.json | diff - tests/authority/expected.txt

      - name: Authority gap with a model in the loop
        run: |
          cargo run -q -- check tests/authority/tools/banking/smoke_banking.ry tests/authority/tools/slack/smoke_slack.ry tests/authority/tools/travel/smoke_travel.ry tests/authority/tools/workspace/smoke_workspace.ry
          python -I tools/authority_gap/model_loop_report.py --tasks tests/authority/tasks_v1.json --results tests/authority/model_loop.json | diff - tests/authority/model_loop_expected.txt
          python -I tools/authority_gap/utility_report.py --tasks tests/authority/tasks_v1.json --results tests/authority/utility.json | diff - tests/authority/utility_expected.txt

      - name: Cheat-sheet token gate
        run: |
          pip install tiktoken
          python tools/count_tokens.py

      - name: Conformance suite
        run: python tools/conformance.py target/debug/renyi

      # the numbers are printed, not gated (decision AG4); the
      # development build optimizes the VM, so they are indicative
      - name: Benchmarks (printed, not gated)
        run: python tools/bench.py target/debug/renyi --runs 1

  # the template tier (decisions AU19 and AU20) writes machine code for the
  # Windows x64 convention as well as for System V, and only a Windows
  # machine runs the second: the VM's tests run there on every push,
  # `tests/template.rs` and `tests/promotion.rs` with the tier forced
  windows:
    name: The VM on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.94.1

      - uses: Swatinem/rust-cache@v2

      - name: Test the VM
        run: cargo test -p renyi_vm

  # the toolchain for the browser (decision AW29, stage 33a): the web
  # crate lints and builds for wasm32-unknown-unknown, and the module runs
  # the hello program of the corpus and the showcase game's demo under
  # node, and the game's play mode driven frame by frame with a fire to
  # leave the title then the demo's moves (decisions AW33 and AW35),
  # through the same script the page's glue mirrors
  wasm:
    name: The toolchain for the browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Clippy for wasm32
        run: cargo clippy -p renyi_web --target wasm32-unknown-unknown -- -D warnings

      - name: Build the module
        run: cargo build -p renyi_web --target wasm32-unknown-unknown --release

      - name: Run hello and the game under node
        run: |
          module=target/wasm32-unknown-unknown/release/renyi_web.wasm
          ls -l "$module"
          test "$(node tools/wasm_check.js "$module" examples/hello.ry)" = "Hello, world!"
          test "$(node tools/wasm_check.js "$module" showcase/raycaster/raycaster.ry showcase/raycaster/*.ry -- demo | tail -1)" = "final score 1120: Escaped"
          moves="S1 F5 R8 F30 L3 S1 W15 S1 W15 R3 F6 L8 F5 R8 F30 L8 S1 W15 S1 W15 F45 R8 F5 L8 F60"
          test "$(node tools/wasm_check.js "$module" showcase/raycaster/raycaster.ry showcase/raycaster/*.ry --script "$moves" -- play | tail -1)" = "final score 1120: Escaped"

  formal:
    name: The core calculus in Lean
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # the toolchain `formal/lean-toolchain` pins, through elan (decision AX7)
      - name: Install elan
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build the proofs
        run: |
          cd formal
          lake build
          test "$(grep -rl sorry RenyiCore RenyiCore.lean | wc -l)" = "0"
